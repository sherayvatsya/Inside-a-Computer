<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>System Entry</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #020617;
        }

        /* 🔥 NEON GRID BACKGROUND */
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 6s linear infinite;
            z-index: 0;
        }

        @keyframes moveGrid {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(50px);
            }
        }

        /* ✨ GLOW EFFECT */
        .glow {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1), transparent);
            animation: moveGlow 8s linear infinite;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(-25%, -25%);
            }

            50% {
                transform: translate(0%, 0%);
            }

            100% {
                transform: translate(-25%, -25%);
            }
        }

        /* 🧊 GLASS CARD */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            min-height: 250px;
            padding: 40px;
            text-align: center;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        /* 🧠 TITLE */
        h1 {
            color: #00f7ff;
            text-shadow: 0 0 20px #00f7ff;
        }

        /* STATUS */
        #status {
            font-size: 14px;
            color: #cbd5f5;
        }

        /* 📊 PROGRESS BAR */
        .progress-box {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f7ff, #00c6ff);
            border-radius: 10px;
            transition: width 0.2s;
        }

        /* 🚀 BUTTON */
        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00f7ff, #00c6ff);
            color: black;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
            transition: 0.3s;
        }

        .btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #00f7ff;
        }


        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="grid"></div>
    <div class="glow"></div>

    <div class="container">
        <h1>⚡ SYSTEM INITIALIZING ⚡</h1>
        <p id="status">Booting...</p>

        <div class="progress-box">
            <div class="progress" id="progress"></div>
        </div>

        <button class="btn" id="enterBtn" onclick="enter()">Enter System 🚀</button>
    </div>

    <audio id="sound" src="click.mp3"></audio>

    <script>
        let progress = 0;
        const bar = document.getElementById("progress");
        const statusText = document.getElementById("status");
        const btn = document.getElementById("enterBtn");

        const messages = [
            "Booting system...",
            "Loading modules...",
            "Connecting AI...",
            "Optimizing UI...",
            "Finalizing..."
        ];

        let msgIndex = 0;

        const interval = setInterval(() => {
            progress += Math.random() * 10;

            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);

                statusText.innerText = "System Ready ✅";
                btn.classList.add("active");

                // 🎙️ AI VOICE
                const voice = new SpeechSynthesisUtterance("Welcome to your system");
                speechSynthesis.speak(voice);
            }

            bar.style.width = progress + "%";

            if (progress > msgIndex * 20 && msgIndex < messages.length) {
                statusText.innerText = messages[msgIndex];
                msgIndex++;
            }

        }, 300);

        function enter() {
            document.getElementById("sound").play();

            document.body.style.transition = "1s";
            document.body.style.opacity = "0";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        }
    </script>

</body>

</html>
